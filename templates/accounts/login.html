{% extends "base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<h1>Iniciar sesión</h1>
<form method="post" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Entrar</button>
</form>
<p><a href="{% url 'accounts:password_reset' %}">¿Olvidaste tu clave?</a></p>
<p><a href="{% url 'accounts:register' %}">Crear cuenta</a></p>
{% endblock %}
