{% extends "base.html" %}
{% block title %}Nueva clave{% endblock %}
{% block content %}
<h1>Elige una nueva clave</h1>
{% if validlink %}
<form class="auth-form" method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Guardar clave</button>
</form>
{% else %}
<p class="empty">El enlace no es válido o ya expiró. Solicita uno nuevo.</p>
<p><a href="{% url 'accounts:password_reset' %}">Recuperar clave</a></p>
{% endif %}
{% endblock %}
