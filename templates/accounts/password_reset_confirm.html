{% extends "base.html" %}
{% block title %}Nueva clave{% endblock %}
{% block content %}
<h1>Elige una nueva clave</h1>
{% if validlink %}
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Guardar clave</button>
</form>
{% else %}
<p>El enlace no es válido o ya expiró. Solicita uno nuevo.</p>
{% endif %}
{% endblock %}
